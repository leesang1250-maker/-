:root{--bg:#e4f2fc;--bg2:#cfe6f7;--card:#fff;--ink:#111;--mut:#6b7078;--sea:#0b2a5b;--sun:#c9a45c;--line:#e3e5e8;--bad:#b3392f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a24;--bg2:#0a131b;--card:#171b22;--ink:#eceef1;--mut:#9aa1ab;--sea:#7fa6e8;--sun:#d9b873;--line:#2a2f38;--bad:#e07a70}}
:root[data-theme="dark"]{--bg:#0e1a24;--bg2:#0a131b;--card:#171b22;--ink:#eceef1;--mut:#9aa1ab;--sea:#7fa6e8;--sun:#d9b873;--line:#2a2f38;--bad:#e07a70}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);color:var(--ink);font:300 16px/1.7 "Noto Sans KR",system-ui,sans-serif;letter-spacing:-.01em}
h1,h2,h3{font-weight:300;line-height:1.3;margin:0;letter-spacing:-.03em}
h2{font-size:1.9rem;padding-bottom:14px;border-bottom:1px solid var(--ink)}
h3{font-size:1.25rem;font-weight:500}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}
header.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:68px}
.brand{font-weight:700;font-size:1.1rem;letter-spacing:-.03em}
nav{display:flex;gap:10px}
nav .btn.nv{display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:8px 18px;line-height:1.35;text-align:left;border:1px solid var(--sea);color:var(--sea);background:var(--card)}
nav .btn.nv b{font-weight:700;font-size:.98rem}
nav .btn.nv small{font-size:.72rem;font-weight:300;opacity:.85}
nav .btn.nv.on{background:var(--sea);color:#fff}
[data-theme="dark"] nav .btn.nv.on{color:#0e1116}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) nav .btn.nv.on{color:#0e1116}}
@media(max-width:640px){nav .btn.nv small{display:none}header.top .wrap{height:auto;padding-top:12px;padding-bottom:12px}}
.btn{border:1px solid var(--line);background:var(--card);border-radius:0;padding:9px 20px;cursor:pointer;font-weight:400}
.btn.on,.btn.pri{background:var(--sea);border-color:var(--sea);color:#fff}
[data-theme="dark"] .btn.pri,[data-theme="dark"] .btn.on{color:#0e1116}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri,:root:not([data-theme="light"]) .btn.on{color:#0e1116}}
.btn.sun{background:var(--sun);border-color:var(--sun);color:#111;font-weight:700}
.btn.del{color:var(--bad)}
.btn.sm{padding:4px 12px;font-size:.85rem}

.badge{display:inline-block;border:1px solid rgba(255,255,255,.6);padding:3px 14px;font-size:.85rem;margin-bottom:22px;font-weight:400}
.hero h1{font-size:clamp(2rem,5.2vw,3.2rem);font-weight:500;max-width:18ch;white-space:pre-line;line-height:1.3}
.hero p{color:rgba(255,255,255,.88);max-width:44ch;margin:18px 0 0;font-size:1.1rem;font-weight:300}
.times{display:flex;align-items:baseline;gap:14px;margin-top:36px;font-size:clamp(1.7rem,4.6vw,2.4rem);font-weight:400;flex-wrap:wrap;letter-spacing:-.02em}
.times small{font-size:.9rem;font-weight:300;color:rgba(255,255,255,.85);letter-spacing:0}
.times i{color:#ffd58a;font-style:normal;font-weight:300}
.meta{color:rgba(255,255,255,.82);margin-top:10px;font-size:.95rem}
.sec{padding:56px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:28px;margin-top:28px}
.room{background:var(--card);border:0;border-radius:0;display:flex;flex-direction:column}
.room .ph{aspect-ratio:4/3;background:linear-gradient(135deg,#7a2a10,#e8a33d);object-fit:cover;width:100%}
.room .b{padding:18px 2px 0;display:flex;flex-direction:column;gap:8px;flex:1}
.tags span{display:inline-block;border:1px solid var(--line);padding:0 10px;font-size:.8rem;margin:0 6px 6px 0;color:var(--mut)}
.price{font-weight:500;font-size:1.1rem}
.cat{color:var(--sea);font-size:.85rem;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:0;padding:24px;margin-top:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label{display:block;font-size:.88rem;color:var(--mut);margin:12px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:0;background:var(--bg)}
textarea{min-height:76px;resize:vertical}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 14px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:.92rem}
th{font-weight:500;border-top:1px solid var(--ink)}
th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.st{font-weight:700}.st.p{color:#b27a12}.st.a{color:var(--sea)}.st.r{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;border-top:1px solid var(--ink);background:var(--card)}
.stats div{padding:18px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.stats b{display:block;font-size:1.7rem;font-weight:300}
.bar{position:sticky;bottom:0;background:var(--sea);color:#fff;padding:14px 28px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
dialog{border:0;border-radius:0;background:var(--card);color:var(--ink);width:min(460px,92vw);padding:28px}
dialog::backdrop{background:rgba(0,0,0,.55)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 20px;display:none;z-index:9}
footer{background:var(--card);border-top:1px solid var(--line);margin-top:72px;padding:32px 0;color:var(--mut);font-size:.88rem}
.muted{color:var(--mut)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><!-- /frame-runtime --><!-- frame-runtime --><!-- /frame-runtime -->






<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>
<script id="state" type="application/json">{"content":{"brand":"일광자이 푸르지오 게스트하우스","badge":"단지 내 입주민 전용 편의시설","heroTitle":"소중한 귀빈을 위한\n일광방 · 자이방 라운지","heroSub":"따스한 채광을 품은 객실에서 가정식 주거 편의시설를 경험해 보세요.","addr":"부산광역시 기장군 일광읍 해빛로 29","phone":"관리사무소 내선 051-714-3280","copy":"© 일광자이 푸르지오 관리사무소. All rights reserved."},"policy":{"checkIn":"15:00","checkOut":"11:00","maxNights":2,"pin":"1234"},"categories":[{"id":"c1","name":"일광게스트 하우스"},{"id":"c2","name":"자이게스트 하우스"}],"rooms":[{"id":"r1","cat":"c1","name":"일광방","price":50000,"base":2,"max":4,"img":"","tags":"온돌 침구류, 주방, 욕실, 거실","desc":"따뜻한 햇살이 드는 모던 객실입니다. "},{"id":"r2","cat":"c2","name":"자이방","price":50000,"base":2,"max":4,"img":"","tags":"넓은 거실,침대 2,욕조","desc":"가족 단위 손님을 위한 넓은 객실입니다."}]}</script>
<script>
const SHELL='<!DOCTYPE html>'+document.documentElement.outerHTML;
let S=JSON.parse(document.getElementById('state').textContent);
let D=JSON.parse(JSON.stringify(S));
const $=(s,e=document)=>e.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won=n=>Number(n||0).toLocaleString('ko-KR')+'원';
const ST={pending:['승인 대기','p'],approved:['승인 완료','a'],rejected:['거절됨','r']};
let RES=[],db=null,view='res',atab='res',admin=false,lookup=null,filt='all';
try{admin=sessionStorage.getItem('adm')==='1'}catch(e){}
const LS='gh_res';
const lsGet=()=>{try{return JSON.parse(localStorage.getItem(LS)||'[]')}catch(e){return[]}};
const lsSet=a=>{try{localStorage.setItem(LS,JSON.stringify(a))}catch(e){}};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d)};
const dirty=()=>JSON.stringify(D)!==JSON.stringify(S);
const BAR=`<div class="bar"><span>저장하지 않은 변경사항이 있습니다.</span><span class="row"><button class="btn sm" data-a="discard">되돌리기</button><button class="btn sun" data-a="publish">변경사항 게시</button></span></div>`;
const catName=id=>(S.categories.find(c=>c.id===id)||{}).name||'';
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2800)}

RES=lsGet();
(async()=>{try{const c=await claude.use('db');if(c){db=c;c.collection('reservations').onSnapshot(s=>{RES=s.docs.map(d=>Object.assign({id:d.id},d.data()));render(true)},()=>{db=null})}}catch(e){}})();

async function addRes(r){
  if(db){await db.collection('reservations').add(r)}
  else{const a=lsGet();r.id='L'+Date.now();a.push(r);lsSet(a);RES=a;render(true)}
}
async function setSt(id,st){
  if(db){await db.collection('reservations').doc(id).update({status:st})}
  else{const a=lsGet();const x=a.find(y=>y.id===id);if(x)x.status=st;lsSet(a);RES=a;render(true)}
}

function render(fromData){
  if(fromData&&view==='adm'&&atab!=='res')return;
  const c=S.content,p=S.policy;
  document.title=c.brand;
  let h=`<header class="top"><div class="wrap"><span class="brand">${esc(c.brand)}</span><nav>
  <button class="btn nv ${view==='res'?'on':''}" data-a="v-res"><b>입주민 예약</b><small>객실 보기 · 예약 신청 · 내역 조회</small></button>
  <button class="btn nv ${view==='adm'?'on':''}" data-a="v-adm"><b>운영자 관리</b><small>예약 승인 · 객실 · 문구 편집</small></button></nav></div></header>`;
  h+=view==='adm'&&admin?adminView():residentView();
  h+=`<footer><div class="wrap"><div>${esc(c.addr)} · 문의 ${esc(c.phone)}</div><div>${esc(c.copy)}</div></div></footer>`;
  if(view==='adm'&&admin&&dirty())h+=BAR;
  $('#app').innerHTML=h;
}

function residentView(){
  const c=S.content,p=S.policy;
  let h=`<section class="hero"><div class="wrap"><span class="badge">${esc(c.badge)}</span><h1>${esc(c.heroTitle)}</h1><p>${esc(c.heroSub)}</p>
  <div class="times"><span>${esc(p.checkIn)}<small> 체크인</small></span><i>→</i><span>${esc(p.checkOut)}<small> 체크아웃</small></span></div>
  <div class="meta">세대별 월 최대 ${p.maxNights}박</div></div></section>
  <div class="wrap"><section class="sec"><h2>이용 가능 객실</h2><div class="grid">`;
  S.categories.forEach(cat=>S.rooms.filter(r=>r.cat===cat.id).forEach(r=>{
    h+=`<article class="room">${r.img?`<img class="ph" src="${esc(r.img)}" alt="${esc(r.name)}">`:'<div class="ph"></div>'}<div class="b">
    <span class="cat">${esc(cat.name)}</span><h3>${esc(r.name)}</h3>
    <div class="tags">${String(r.tags||'').split(',').filter(t=>t.trim()).map(t=>`<span>${esc(t.trim())}</span>`).join('')}</div>
    <p class="muted" style="margin:0">${esc(r.desc)}</p><div class="muted">기준 ${r.base}명 · 최대 ${r.max}명</div>
    <div class="row" style="justify-content:space-between;margin-top:auto"><span class="price">${won(r.price)} / 1박</span><button class="btn pri" data-a="book" data-id="${r.id}">예약 신청</button></div></div></article>`}));
  if(!S.rooms.length)h+='<p class="muted">등록된 객실이 없습니다.</p>';
  h+=`</div></section><section class="sec"><h2>나의 예약 내역</h2><div class="card"><div class="row"><input id="lk" placeholder="동·호수 (예: 101-1203)" style="max-width:260px" value="${esc(lookup||'')}"><button class="btn pri" data-a="lookup">조회</button></div>`;
  if(lookup!==null){
    const m=RES.filter(r=>r.unit===lookup).sort((a,b)=>a.ci<b.ci?1:-1);
    h+=m.length?`<div class="tw"><table><tr><th>객실</th><th>일정</th><th>금액</th><th>상태</th></tr>${m.map(r=>`<tr><td>${esc(r.roomName)}</td><td>${r.ci} ~ ${addDays(r.ci,r.nights)} (${r.nights}박)</td><td>${won(r.amount)}</td><td class="st ${ST[r.status][1]}">${ST[r.status][0]}</td></tr>`).join('')}</table></div>`:'<p class="muted">조회된 예약이 없습니다. 동·호수를 다시 확인해 주세요.</p>'}
  else h+='<p class="muted">동·호수를 입력하고 조회를 눌러 주세요.</p>';
  return h+'</div></section></div>';
}

function adminView(){
  const ym=today().slice(0,7);
  const mo=RES.filter(r=>r.ci.slice(0,7)===ym);
  const ap=mo.filter(r=>r.status==='approved');
  let h=`<div class="wrap" style="padding-top:28px"><div class="row" style="justify-content:space-between"><h2>게스트하우스 운영 관리</h2><button class="btn sm" data-a="logout">관리자 로그아웃</button></div>
  <div class="stats" style="margin-top:16px"><div>이달 승인 예약<b>${ap.length}건</b></div><div>승인 대기<b>${RES.filter(r=>r.status==='pending').length}건</b></div><div>이달 예상 수입<b>${won(ap.reduce((s,r)=>s+r.amount,0))}</b></div></div>
  <div class="row" style="margin-top:20px">${[['res','예약 관리'],['rooms','객실 · 카테고리'],['pol','운영 정책'],['txt','페이지 문구']].map(t=>`<button class="btn ${atab===t[0]?'on':''}" data-a="tab" data-id="${t[0]}">${t[1]}</button>`).join('')}</div>`;
  if(atab==='res'){
    const L=RES.filter(r=>filt==='all'||r.status===filt).sort((a,b)=>a.ci<b.ci?1:-1);
    h+=`<div class="card"><div class="row"><select id="flt" style="max-width:180px"><option value="all">전체 상태</option>${Object.keys(ST).map(k=>`<option value="${k}" ${filt===k?'selected':''}>${ST[k][0]}</option>`).join('')}</select></div>
    <div class="tw"><table><tr><th>번호</th><th>동·호수</th><th>신청자</th><th>객실</th><th>일정</th><th>금액</th><th>상태</th><th>처리</th></tr>
    ${L.map(r=>`<tr><td>${esc(String(r.id).slice(-5))}</td><td>${esc(r.unit)}</td><td>${esc(r.name)}<br><span class="muted">${esc(r.phone)}</span></td><td>${esc(r.roomName)} (${r.guests}명)</td><td>${r.ci} ~ ${addDays(r.ci,r.nights)}</td><td>${won(r.amount)}</td><td class="st ${ST[r.status][1]}">${ST[r.status][0]}</td>
    <td>${r.status==='pending'?`<button class="btn sm pri" data-a="ok" data-id="${esc(r.id)}">승인</button> <button class="btn sm del" data-a="no" data-id="${esc(r.id)}">거절</button>`:''}</td></tr>`).join('')||'<tr><td colspan="8" class="muted">예약 내역이 없습니다.</td></tr>'}</table></div>
    <p class="muted" style="font-size:.85rem">${db?'예약은 공유 데이터베이스에 저장됩니다.':'공유 저장소를 사용할 수 없어 이 브라우저에만 저장 중입니다.'}</p></div>`;
  }
  if(atab==='rooms'){
    h+=`<div class="card"><h3>카테고리</h3>${D.categories.map((c,i)=>`<div class="row" style="margin-top:8px"><input data-c="${i}" value="${esc(c.name)}" style="max-width:260px"><button class="btn sm del" data-a="delcat" data-id="${i}">삭제</button></div>`).join('')}<button class="btn sm" style="margin-top:10px" data-a="addcat">카테고리 추가</button></div>`;
    D.rooms.forEach((r,i)=>{
      const f=(k,l,t)=>`<div><label>${l}</label><input ${t==='n'?'type="number" min="0"':''} data-r="${i}" data-f="${k}" value="${esc(r[k])}"></div>`;
      h+=`<div class="card"><div class="f2">${f('name','객실 이름')}<div><label>소속 카테고리</label><select data-r="${i}" data-f="cat">${D.categories.map(c=>`<option value="${c.id}" ${c.id===r.cat?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>${f('price','1박 요금(원)','n')}${f('base','기준 인원','n')}${f('max','최대 인원','n')}</div>
      <div class="f2">${f('img','이미지 URL (선택)')}${f('tags','태그 (쉼표 구분)')}</div><label>객실 설명</label><textarea data-r="${i}" data-f="desc">${esc(r.desc)}</textarea>
      <button class="btn sm del" style="margin-top:10px" data-a="delroom" data-id="${i}">객실 삭제</button></div>`});
    h+='<button class="btn pri" style="margin-top:16px" data-a="addroom">신규 객실 등록</button>';
  }
  if(atab==='pol'){
    const f=(k,l,t)=>`<div><label>${l}</label><input ${t||''} data-k="policy.${k}" value="${esc(D.policy[k])}"></div>`;
    h+=`<div class="card"><div class="f2">${f('checkIn','체크인 시간','type="time"')}${f('checkOut','체크아웃 시간','type="time"')}${f('maxNights','세대별 월 최대 예약 박수','type="number" min="1"')}${f('pin','관리자 접속 PIN')}</div></div>`;
  }
  if(atab==='txt'){
    const f=(k,l,ta)=>`<label>${l}</label>${ta?`<textarea data-k="content.${k}">${esc(D.content[k])}</textarea>`:`<input data-k="content.${k}" value="${esc(D.content[k])}">`}`;
    h+=`<div class="card">${f('brand','사이트 이름')}${f('badge','상단 안내 배지')}${f('heroTitle','메인 제목 (줄바꿈 가능)',1)}${f('heroSub','소개 문구',1)}${f('addr','관리사무소 주소')}${f('phone','문의 전화')}${f('copy','저작권 문구')}</div>`;
  }
  return h+'</div>';
}

function bookDlg(id){
  const r=S.rooms.find(x=>x.id===id);if(!r)return;
  const n=S.policy.maxNights;
  $('#dlg').innerHTML=`<h3>${esc(r.name)} 예약 신청</h3><div id="bf"><label>동·호수</label><input id="b-u" placeholder="101-1203"><label>신청 입주민 성함</label><input id="b-n"><label>연락처</label><input id="b-p" type="tel" placeholder="010-0000-0000">
  <div class="f2"><div><label>체크인 일자</label><input id="b-d" type="date" min="${today()}"></div><div><label>이용 박수</label><select id="b-k">${Array.from({length:n},(_,i)=>`<option>${i+1}</option>`).join('')}</select></div><div><label>투숙 인원 (최대 ${r.max}명)</label><input id="b-g" type="number" min="1" max="${r.max}" value="${r.base}"></div></div>
  <p>총 결제 예정 금액 <b id="b-t">${won(r.price)}</b></p><p class="muted" style="font-size:.85rem">이용 요금은 익월 관리비에 통합 청구됩니다.</p></div>
  <div class="row" style="justify-content:flex-end"><button class="btn" data-a="close">취소</button><button class="btn pri" data-a="submit" data-id="${r.id}">예약 신청 완료</button></div>`;
  $('#b-k').onchange=()=>$('#b-t').textContent=won(r.price*$('#b-k').value);
  $('#dlg').showModal();
}
function submit(id){
  const r=S.rooms.find(x=>x.id===id),v=k=>$('#b-'+k).value.trim();
  const u=v('u'),nm=v('n'),ph=v('p'),d=v('d'),k=+v('k'),g=+v('g');
  if(!u||!nm||!ph||!d)return toast('모든 항목을 입력해 주세요.');
  if(d<today())return toast('오늘 이후 날짜를 선택해 주세요.');
  if(!(g>=1&&g<=r.max))return toast('투숙 인원은 1~'+r.max+'명입니다.');
  const act=RES.filter(x=>x.status!=='rejected');
  const used=act.filter(x=>x.unit===u&&x.ci.slice(0,7)===d.slice(0,7)).reduce((s,x)=>s+x.nights,0);
  if(used+k>S.policy.maxNights)return toast('세대별 월 최대 '+S.policy.maxNights+'박까지 가능합니다. (이번 달 신청 '+used+'박)');
  const end=addDays(d,k);
  if(act.some(x=>x.roomId===id&&x.ci<end&&addDays(x.ci,x.nights)>d))return toast('해당 일정에 이미 예약된 객실입니다.');
  addRes({unit:u,name:nm,phone:ph,roomId:id,roomName:r.name,ci:d,nights:k,guests:g,amount:r.price*k,status:'pending',createdAt:Date.now()})
    .then(()=>{$('#dlg').close();lookup=u;render();toast('예약 신청이 접수되었습니다.')})
    .catch(()=>toast('예약을 저장하지 못했습니다. 잠시 후 다시 시도해 주세요.'));
}
function pinDlg(){
  $('#dlg').innerHTML=`<h3>운영자 인증</h3><label>관리자 PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="off"><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" data-a="close">취소</button><button class="btn pri" data-a="login">접속</button></div>`;
  $('#dlg').showModal();
}
async function publish(){
  const j=JSON.stringify(D).replace(/</g,'\\u003c');
  const html=SHELL.replace(/(<script id="state" type="application\/json">)[\s\S]*?(<\/script>)/,(m,a,b)=>a+j+b);
  try{
    const a=await claude.use('artifact');
    if(!a)return toast('게시 권한이 없습니다. 페이지 소유자 계정으로 열어 주세요.');
    await a.publish(html);
  }catch(e){
    toast(e&&(e.code==='not_writer'||e.code==='not_granted')?'게시 권한이 없습니다. 소유자 또는 편집자만 게시할 수 있습니다.':e&&e.code==='conflict'?'다른 편집이 먼저 게시되어 새로 불러옵니다.':'게시하지 못했습니다. 다시 시도해 주세요.');
  }
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  const a=t.dataset.a,id=t.dataset.id;
  if(a==='v-res'){view='res';render()}
  else if(a==='v-adm'){view='adm';admin?render():(render(),pinDlg())}
  else if(a==='close')$('#dlg').close();
  else if(a==='login'){if($('#pin').value===S.policy.pin){admin=true;try{sessionStorage.setItem('adm','1')}catch(x){}$('#dlg').close();render()}else toast('PIN이 올바르지 않습니다.')}
  else if(a==='logout'){admin=false;view='res';try{sessionStorage.removeItem('adm')}catch(x){}render()}
  else if(a==='book')bookDlg(id);
  else if(a==='submit')submit(id);
  else if(a==='lookup'){lookup=$('#lk').value.trim();render()}
  else if(a==='tab'){atab=id;render()}
  else if(a==='ok'||a==='no')setSt(id,a==='ok'?'approved':'rejected');
  else if(a==='addcat'){D.categories.push({id:'c'+Date.now(),name:'새 카테고리'});render()}
  else if(a==='delcat'){const c=D.categories[id];if(D.rooms.some(r=>r.cat===c.id))toast('이 카테고리에 속한 객실을 먼저 옮기거나 삭제해 주세요.');else{D.categories.splice(id,1);render()}}
  else if(a==='addroom'){if(!D.categories.length)return toast('먼저 카테고리를 추가해 주세요.');D.rooms.push({id:'r'+Date.now(),cat:D.categories[0].id,name:'새 객실',price:30000,base:2,max:4,img:'',tags:'',desc:''});render()}
  else if(a==='delroom'){if(confirm('이 객실을 삭제할까요?')){D.rooms.splice(id,1);render()}}
  else if(a==='discard'){D=JSON.parse(JSON.stringify(S));render()}
  else if(a==='publish')publish();
});
function mark(){const b=$('.bar'),d=dirty();if(d&&!b)$('#app').insertAdjacentHTML('beforeend',BAR);else if(!d&&b)b.remove()}
document.addEventListener('input',e=>{
  const t=e.target,ds=t.dataset;
  if(ds.k){const[g,k]=ds.k.split('.');D[g][k]=t.type==='number'?+t.value:t.value;mark()}
  else if(ds.c!==undefined){D.categories[ds.c].name=t.value;mark()}
  else if(ds.r!==undefined){D.rooms[ds.r][ds.f]=t.type==='number'?+t.value:t.value;mark()}
});
document.addEventListener('change',e=>{if(e.target.id==='flt'){filt=e.target.value;render()}});
render();
</script></body></html>
